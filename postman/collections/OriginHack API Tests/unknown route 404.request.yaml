$kind: http-request
method: GET
url: '{{base_url}}/this-route-should-not-exist'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });

      pm.test('Not found signal is present', function () {
        const bodyText = pm.response.text().toLowerCase();
        pm.expect(bodyText).to.match(/not found|404/);
      });