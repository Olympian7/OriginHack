$kind: http-request
method: GET
url: '{{base_url}}{{generated_audio_url}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 for generated audio fetch', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Content-Type indicates audio or downloadable content', function () {
        const contentType = pm.response.headers.get('Content-Type') || '';
        pm.expect(contentType.toLowerCase()).to.match(/audio|octet-stream|mpeg|wav/);
      });

      pm.test('Response body is not empty', function () {
        pm.expect(pm.response.size().body).to.be.greaterThan(0);
      });