$kind: http-request
method: POST
url: '{{base_url}}/api/conversation/text'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "",
      "message": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is validation failure', function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 422]);
      });

      const bodyText = pm.response.text();
      pm.test('Validation error mentions missing/invalid input', function () {
        pm.expect(bodyText.toLowerCase()).to.match(/invalid|required|message|session/);
      });