$kind: http-request
method: POST
url: '{{base_url}}/api/conversation/text'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionId": "{{session_id}}",
      "message": "{{text_message}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is success', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      const json = pm.response.json();
      pm.test('Response is JSON object', function () {
        pm.expect(json).to.be.an('object');
      });

      pm.test('Response includes text or audio output fields', function () {
        const keys = Object.keys(json);
        pm.expect(keys.length).to.be.greaterThan(0);
        pm.expect(JSON.stringify(json)).to.match(/message|response|reply|audio|url/i);
      });

      const audioUrl = json.generated_audio_url || json.generatedAudioUrl || json.audio_url || json.audioUrl || json.url;
      if (audioUrl) {
        pm.collectionVariables.set('generated_audio_url', audioUrl);
      }

      pm.test('generated_audio_url saved when present', function () {
        if (audioUrl) {
          pm.expect(pm.collectionVariables.get('generated_audio_url')).to.eql(audioUrl);
        } else {
          pm.expect(true).to.eql(true);
        }
      });